name: validate-skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m compileall -q scripts tests
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate skill frontmatter and resource links
        run: python scripts/validate_skill_package.py .
